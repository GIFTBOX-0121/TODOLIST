<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TODO 管理画面</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px}input:not([type=checkbox]),textarea{width:100%;padding:11px;border:1px solid #d8cde3;border-radius:9px;margin:5px 0 12px;font:inherit}button{border:1px solid #cbb9d9;background:white;border-radius:10px;padding:10px;cursor:pointer;margin:3px}section{background:#ffffffbb;border-radius:15px;padding:18px;margin:18px 0}label{display:block;margin-top:10px}.editor{min-height:130px;border:1px solid #d8cde3;border-radius:10px;background:white;padding:12px;overflow-wrap:anywhere}.editor img{max-width:100%}</style></head><body><main class="shell"><h1>TODO 管理画面</h1><section><label>管理トークン<input id="token" type="password" autocomplete="off" placeholder="Cloudflareに設定したADMIN_TOKEN"></label><button id="connect">読み込む</button><p id="status" role="status"></p></section><div id="panel" hidden><section><h2>TODO編集</h2><label>タイトル<input id="title" maxlength="200"></label><label>詳細</label><div><button data-cmd="bold">太字</button><button data-cmd="underline">下線</button><button id="color">文字色</button><button id="size">文字サイズ</button><button id="link">リンク</button><button id="image">画像URL</button></div><div id="editor" class="editor" contenteditable="true" aria-label="詳細本文"></div><label>表示順（小さい数字が先）<input id="position" type="number" value="0"></label><label><input id="visible" type="checkbox" checked> 公開する</label><p><button id="save">保存</button><button id="new">新規作成</button></p><h3>登録済みTODO</h3><div id="todoList"></div></section><section><h2>上部リンク（6件）</h2><div id="linkList"></div></section></div></main><script src="admin.js"></script></body></html>
